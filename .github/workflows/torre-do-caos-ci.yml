name: Torre do Caos | Java CI
on:
  pull_request:
    paths:
      - 'torre-do-caos/**'
      - '.github/workflows/torre-do-caos-ci.yml'
  push:
    branches:
      - 'feat/torre-do-caos-f0-f1'
      - 'feat/torre-void-worlds-lobby'
    paths:
      - 'torre-do-caos/**'
      - '.github/workflows/torre-do-caos-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torre-do-caos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Testar e compilar JAR
        run: gradle clean test jar --no-daemon
      - name: Preparar pacote para Shulkerboxes - sem deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="$(find build/libs -maxdepth 1 -type f -name 'TorreDoCaos-*.jar' | head -n 1)"
          test -n "$JAR" && test -f "$JAR"
          jar tf "$JAR" | grep -qx 'plugin.yml'
          jar tf "$JAR" | grep -qx 'br/com/hallancraft/torredocaos/TorreDoCaosPlugin.class'
          jar tf "$JAR" | grep -qx 'br/com/hallancraft/torredocaos/world/TowerWorldService.class'
          jar tf "$JAR" | grep -qx 'br/com/hallancraft/torredocaos/world/VoidWorldGenerator.class'
          cp "$JAR" dist/TorreDoCaos-Paper-1.21.4-WorldsPreview.jar
          (cd dist && sha256sum TorreDoCaos-Paper-1.21.4-WorldsPreview.jar > SHA256.txt)
          {
            echo 'HALLANCRAFT TORRE DO CAOS - F1.2.2 PREVIA DE MUNDOS'
            echo 'NOVO servidor Paper 1.21.4 + Java 21. NUNCA instalar no servidor familiar.'
            echo 'Apos iniciar, o plugin cria automaticamente 3 mundos void, lobby e 12 torres.'
            echo 'Comandos: /torre status, /torre jogar, /torre lobby.'
            echo 'SEM ondas, drops, combate, reset seguro, progressao real ou multirun persistente.'
            echo 'Nao enviar ZIP como plugin. Extraia o JAR e envie pelo painel Plugins.'
            echo 'Sem deploy automatico nem merge em main.'
            echo 'Documentacao: https://github.com/hallanbrito/HallanCraft/blob/feat/torre-void-worlds-lobby/torre-do-caos/docs/F1-2-2-TRES-MUNDOS.md'
          } > dist/LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TorreDoCaos-WorldsPreview-F1.2.2
          path: torre-do-caos/dist/
          if-no-files-found: error
          retention-days: 30
