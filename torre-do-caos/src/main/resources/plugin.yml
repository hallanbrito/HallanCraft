name: TorreDoCaos
main: br.com.hallancraft.torredocaos.TorreDoCaosPlugin
version: 0.1.2-PREVIEW
api-version: '1.21.4'
description: Torre do Caos - tres mundos vazios, lobby e arenas isoladas (sem gameplay)
load: POSTWORLD
author: HallanCraft
commands:
  torre:
    description: Lobby, arena de previa e administracao de blueprints
    usage: /torre <jogar|lobby|status|admin>
permissions:
  torredocaos.admin:
    description: Exportar e verificar blueprints
    default: op
