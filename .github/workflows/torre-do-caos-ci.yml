name: Torre do Caos | Java CI
on:
  pull_request:
    paths:
      - 'torre-do-caos/**'
      - '.github/workflows/torre-do-caos-ci.yml'
  push:
    branches:
      - 'feat/torre-do-caos-f0-f1'
    paths:
      - 'torre-do-caos/**'
      - '.github/workflows/torre-do-caos-ci.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torre-do-caos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unit tests
        run: gradle test --no-daemon
      - name: Build JAR (not deployed)
        run: gradle jar --no-daemon
